name: Run P05 Accessibility Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accessibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Augsburg data
        run: python src/01_download_data.py

      - name: Check data and create preview
        run: python src/02_check_data.py

      - name: Snap pharmacies to pedestrian network
        run: python src/03_snap_pharmacies.py

      - name: Calculate network accessibility
        run: python src/04_network_accessibility.py

      - name: Copy lightweight Step 2 results
        run: |
          mkdir -p results
          cp outputs/data_summary.csv results/step2_data_summary.csv
          cp outputs/data_summary.txt results/step2_data_summary.txt
          cp outputs/step2_data_preview.png results/step2_data_preview.png

      - name: Identify accessibility gaps
        run: python src/05_accessibility_gaps.py

      - name: Create portfolio summary
        run: python src/06_portfolio_visuals.py

      - name: Commit lightweight results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update P05 analysis results"
            git push
          fi

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: p05-final-full-output
          path: |
            outputs/
            results/
